# Who may connect to Sandboxes in team-a: anyone who can update Sandboxes there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-editor
  namespace: team-a
rules:
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-editors
  namespace: team-a
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sandbox-editor}
subjects:
- {apiGroup: rbac.authorization.k8s.io, kind: User, name: alice}

apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssh-gateway
  namespace: sandbox-gateway
---
# The gateway asks the API server who may update Sandboxes, and resumes suspended ones.
# It cannot create, delete or read anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ssh-gateway
rules:
- apiGroups: [authorization.k8s.io]
  resources: [subjectaccessreviews]
  verbs: [create]
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ssh-gateway
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ssh-gateway}
subjects:
- {kind: ServiceAccount, name: ssh-gateway, namespace: sandbox-gateway}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssh-gateway-state
  namespace: sandbox-gateway
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-gateway
  namespace: sandbox-gateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: ssh-gateway}}
  template:
    metadata:
      labels: {app: ssh-gateway}
    spec:
      serviceAccountName: ssh-gateway
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532}
      containers:
      - name: ssh-gateway
        image: ssh-gateway:v4
        imagePullPolicy: Never
        args:
        - -listen=:2222
        - -host-key=/etc/ssh-gateway/keys/host_key
        - -upstream-key=/etc/ssh-gateway/keys/upstream_key
        - -ca-pub=/etc/ssh-gateway/ca/ca_key.pub
        - -sandbox-hostkeys=/var/lib/ssh-gateway/sandbox_hostkeys.json
        - -authz-ttl=30s
        - -recheck=30s
        # Desktop HTTP gateway: <sandbox>--<namespace>.<domain>. Keys come from the
        # http-gateway-token-pub ConfigMap.
        - -http-listen=:8080
        - -http-domain=localhost
        - -token-pub=/etc/ssh-gateway/token/token_pub
        ports: [{name: ssh, containerPort: 2222}, {name: http, containerPort: 8080}]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: keys, mountPath: /etc/ssh-gateway/keys, readOnly: true}
        - {name: ca, mountPath: /etc/ssh-gateway/ca, readOnly: true}
        - {name: token, mountPath: /etc/ssh-gateway/token, readOnly: true}
        - {name: state, mountPath: /var/lib/ssh-gateway}
      volumes:
      - {name: keys, secret: {secretName: ssh-gateway-keys, defaultMode: 0440}}
      - {name: ca, configMap: {name: ssh-gateway-ca}}
      - {name: token, configMap: {name: http-gateway-token-pub}}
      - {name: state, persistentVolumeClaim: {claimName: ssh-gateway-state}}
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-gateway
  namespace: sandbox-gateway
spec:
  selector: {app: ssh-gateway}
  ports: [{name: ssh, port: 22, targetPort: ssh}, {name: http, port: 80, targetPort: http}]
